[project]
name = "biped_robot"
version = "0.0.1"
description = "BR-1 bipedal humanoid: MuJoCo simulation + RL locomotion framework"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
